name: Publish authentication callback
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: auth-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare public files
        run: |
          mkdir -p public/.well-known
          cp index.html public/
          cp -r pixel-auth public/
          cp .well-known/apple-app-site-association public/.well-known/
          cp .well-known/apple-app-site-association public/apple-app-site-association
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
